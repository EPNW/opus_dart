name: opus_dart
version: 4.0.0
homepage: https://github.com/EPNW/opus_dart
description: Wraps libopus in dart, and additionally provides a dart friendly API for encoding and decoding

environment:
  sdk: ^3.4.3

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  lints: ^4.0.0
  ffigen: ^13.0.0

ffigen:
  output: 'lib/src/generated_bindings.dart'
  name: 'OpusBindings'
  description: 'The main class for the generated bindings containing all the methods from the opus header files.'
  headers:
    entry-points:
      - 'opus/1.3.1/include/opus.h'
      - 'opus/1.3.1/include/opus_custom.h'
      - 'opus/1.3.1/include/opus_defines.h'
      - 'opus/1.3.1/include/opus_multistream.h'
      - 'opus/1.3.1/include/opus_projection.h'
      - 'opus/1.3.1/include/opus_types.h'